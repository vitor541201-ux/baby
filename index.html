<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de Mimos 💌</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --rosa-fundo:#fff0f3; --rosa-claro:#ffd9e2; --rosa:#ff8fab; --vermelho:#e5566d;
  --vinho:#7a2e44; --creme:#fffaf6; --verde:#7fcf9f;
  --sombra:0 10px 25px rgba(229,86,109,.18);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--vinho);
  background:radial-gradient(circle at 20% 10%,#ffe3ea 0,transparent 45%),
             radial-gradient(circle at 85% 90%,#ffd0dc 0,transparent 45%),var(--rosa-fundo);
  background-attachment:fixed;overflow-x:hidden;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
h1,h2,.script{font-family:'Nunito',sans-serif;font-weight:800}

/* corações flutuando */
#floaters{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.floater{position:absolute;bottom:-40px;opacity:.4;animation:subir linear forwards}
@keyframes subir{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}

/* ---------- ENTRADA ---------- */
#entrada{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:24px;transition:opacity .7s,transform .7s}
#entrada.saindo{opacity:0;transform:scale(1.15);pointer-events:none}
.coracao{font-size:min(30vw,120px);line-height:1;cursor:pointer;animation:bater 2.4s ease-in-out infinite;filter:drop-shadow(0 10px 14px rgba(229,86,109,.3));background:none;border:0}
@keyframes bater{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.1)}}
#entrada h1{font-size:clamp(1.5rem,7vw,2.2rem);color:var(--vermelho)}
#entrada p{max-width:28ch;opacity:.85}
.btn-entrar{
  font:800 1.05rem 'Nunito',sans-serif;color:#fff;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--rosa),var(--vermelho));
  padding:16px 30px;border-radius:999px;box-shadow:var(--sombra);
  transition:transform .25s,box-shadow .25s;
}
.btn-entrar:hover{transform:translateY(-3px) scale(1.03)}
.btn-entrar:active{transform:scale(.96)}

/* ---------- PAINEL ---------- */
#painel{position:relative;z-index:1;max-width:460px;margin:0 auto;padding:34px 18px 60px;opacity:0;transform:translateY(20px);transition:opacity .8s .3s,transform .8s .3s}
#painel.visivel{opacity:1;transform:none}
#painel[hidden]{display:none}
header{text-align:center;margin-bottom:22px}
header h1{font-size:clamp(1.55rem,7vw,2rem);color:var(--vermelho);line-height:1.35}
header p{margin-top:8px;font-size:.98rem}
.contador{
  display:inline-flex;align-items:center;gap:8px;margin-top:14px;
  background:var(--creme);padding:9px 18px;border-radius:999px;box-shadow:var(--sombra);font-weight:800;
}
.contador b{color:var(--vermelho);font-size:1.2rem}

/* ---------- TICKET ---------- */
.cupom{perspective:1200px;margin:22px 0}
.cupom-inner{position:relative;transition:transform .8s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.cupom.ativado .cupom-inner{transform:rotateY(180deg)}
.face{
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:22px;padding:22px 20px 20px;position:relative;filter:drop-shadow(0 10px 14px rgba(229,86,109,.22));
}
/* bordas serrilhadas (furinhos laterais do bilhete) */
.frente{
  background:var(--creme);
  -webkit-mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
}
.verso{
  position:absolute;inset:0;transform:rotateY(180deg);
  background:linear-gradient(145deg,var(--rosa),var(--vermelho));color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;
  -webkit-mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 11px at 0 62%,#0000 98%,#000) left/51% 100% no-repeat,
               radial-gradient(circle 11px at 100% 62%,#0000 98%,#000) right/51% 100% no-repeat;
}
.topo{display:flex;align-items:center;gap:12px}
.emoji{font-size:2.3rem;background:var(--rosa-claro);width:58px;height:58px;border-radius:18px;display:grid;place-items:center;flex:none}
.topo small{font-weight:800;color:var(--rosa);letter-spacing:.04em}
.topo h2{font-size:1.25rem;color:var(--vermelho);line-height:1.3}
.desc{margin:14px 0 12px;line-height:1.5}
.regra{background:var(--rosa-fundo);border-radius:14px;padding:10px 14px;font-size:.88rem;line-height:1.45;margin-bottom:16px}
.regra b{color:var(--vermelho)}
.picote{border-top:2.5px dashed var(--rosa-claro);margin:0 -6px 14px}
.rodape{display:flex;align-items:center;justify-content:space-between;gap:10px}
.codigo{font:800 .85rem 'Nunito',monospace;letter-spacing:.12em;color:var(--vinho);background:var(--rosa-claro);padding:8px 12px;border-radius:10px}
.codigo span{display:block;font-size:.62rem;letter-spacing:.05em;opacity:.7;font-weight:600}
.btn-resgatar{
  font:800 .95rem 'Nunito',sans-serif;color:#fff;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--rosa),var(--vermelho));padding:13px 18px;border-radius:999px;
  box-shadow:0 6px 14px rgba(229,86,109,.35);transition:transform .25s,box-shadow .25s,filter .25s;
}
.btn-resgatar:hover{transform:translateY(-2px);filter:brightness(1.06)}
.btn-resgatar:active{transform:scale(.94)}
.verso .grande{font-size:2.6rem}
.verso h3{font-weight:800;font-size:1.35rem}
.verso p{font-size:.95rem;line-height:1.5;max-width:26ch}
.verso .cod{background:#ffffff33;border:2px dashed #fff;padding:6px 14px;border-radius:12px;font-weight:800;letter-spacing:.14em;font-size:.85rem}

footer{text-align:center;margin-top:34px;font-size:.95rem;opacity:.85}
footer .script{color:var(--vermelho);font-size:1rem;display:block;margin-top:4px}

:focus-visible{outline:3px solid var(--vermelho);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="floaters" aria-hidden="true"></div>

<!-- TELA DE ENTRADA -->
<section id="entrada">
  <button class="coracao" id="coracao" aria-label="Abrir painel">🎟️</button>
  <h1>Uma pausa nos estudos</h1>
  <p>Alguns vales para você usar quando quiser.</p>
  <button class="btn-entrar" id="btnEntrar">Entrar no meu Painel de Mimos</button>
</section>

<!-- PAINEL -->
<main id="painel" hidden>
  <header>
    <h1>Painel de Cupons da Estudante Mais Linda</h1>
    <p>Você anda estudando muito. Estes vales são seus, use quando quiser.</p>
    <div class="contador">Resgatados: <b id="cont">0</b> de <b id="total">5</b></div>
  </header>
  <div id="lista"></div>
  <footer>
    Todos valem de verdade. É só me cobrar.
    <span class="script">De: seu namorado</span>
  </footer>
</main>

<script>
const cupons = [
  {emoji:"🚗", titulo:"Operação Resgate", desc:"Eu pego a estrada por 1 hora para buscar você e a gente passa um fim de semana sem livros.", regra:"Avisar com 3 dias de antecedência. Proibido levar apostila na mala.", codigo:"RESGATE-01"},
  {emoji:"🍕", titulo:"O Chef vai até você", desc:"Eu assumo a cozinha (ou o delivery) na próxima visita. Você só escolhe o que quer comer.", regra:"Válido na próxima visita. O cardápio é escolha sua.", codigo:"CHEF-02"},
  {emoji:"💆", titulo:"Spa Pós-Prova", desc:"30 minutos de massagem e cafuné, sem falar de estudos.", regra:"Vale depois de qualquer prova. Assunto proibido: matéria.", codigo:"SPA-03"},
  {emoji:"🎬", titulo:"Eu Escolho o Filme, Você Dorme", desc:"Você escolhe o filme. Se dormir de cansaço, ganha cafuné.", regra:"Dormir no meio é permitido.", codigo:"FILME-04"},
  {emoji:"☕", titulo:"Café Virtual da Aprovação", desc:"Um iFood surpresa enviado por mim no meio da tarde.", regra:"Chega sem aviso. Vale para 1 pedido.", codigo:"CAFE-05"}
];

const $ = s => document.querySelector(s);
const lista = $('#lista');
let resgatados = 0;
$('#total').textContent = cupons.length;

cupons.forEach(c => {
  const el = document.createElement('article');
  el.className = 'cupom';
  el.innerHTML = `
    <div class="cupom-inner">
      <div class="face frente">
        <div class="topo">
          <div class="emoji">${c.emoji}</div>
          <div><small>VALE</small><h2>${c.titulo}</h2></div>
        </div>
        <p class="desc">${c.desc}</p>
        <div class="regra"><b>Regra:</b> ${c.regra}</div>
        <div class="picote"></div>
        <div class="rodape">
          <div class="codigo"><span>código de ativação</span>${c.codigo}</div>
          <button class="btn-resgatar">Resgatar Cupom</button>
        </div>
      </div>
      <div class="face verso">
        <div class="grande">✅</div>
        <h3>Cupom Ativado!</h3>
        <p>Mande um print para o seu namorado para cobrar!</p>
        <div class="cod">${c.codigo}</div>
      </div>
    </div>`;
  el.querySelector('.btn-resgatar').addEventListener('click', () => {
    if (el.classList.contains('ativado')) return;
    el.classList.add('ativado');
    resgatados++;
    $('#cont').textContent = resgatados;
    chuva(8);
  });
  lista.appendChild(el);
});

/* corações flutuantes */
function coracaozinho(){
  const f = document.createElement('div');
  f.className = 'floater';
  f.textContent = ['🌸','✨','🌷'][Math.floor(Math.random()*5)];
  f.style.left = Math.random()*100 + 'vw';
  f.style.fontSize = (12 + Math.random()*10) + 'px';
  f.style.animationDuration = (7 + Math.random()*6) + 's';
  $('#floaters').appendChild(f);
  setTimeout(() => f.remove(), 14000);
}
function chuva(n){ for(let i=0;i<n;i++) setTimeout(coracaozinho, i*90); }

/* entrar */
function entrar(){
  $('#entrada').classList.add('saindo');
  const p = $('#painel');
  p.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => p.classList.add('visivel')));
  setTimeout(() => $('#entrada').remove(), 800);
  window.scrollTo(0,0);
}
$('#btnEntrar').addEventListener('click', entrar);
$('#coracao').addEventListener('click', entrar);
</script>
</body>
</html>
